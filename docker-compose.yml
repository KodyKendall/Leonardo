# ⚠️  PLATFORM-MANAGED FILE — DO NOT HAND-EDIT.
# bin/update overwrites this file wholesale on every platform update.
# Per-instance changes (extra mounts, mem limits, custom services) belong in
#   docker-compose.override.yml  (auto-merged by docker compose; never touched by updates).
# Always run plain `docker compose` from this directory — an explicit
# `-f docker-compose.yml` skips the override file.

version: "3.8"

# Cap container logs (json-file grows unbounded by default and fills the disk)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  llamapress:
    image: kody06/llamapress-simple:0.7.2.1        # <— pre-built tag (includes erb_lint)
    # user: "1000:1000"  # Run as UID 1000 to prevent root-owned file creation
    env_file: .env                           # read secrets from this file
    environment:
      - RAILS_ENV=development
      - BOOTSNAP_CACHE_DIR=/rails/tmp/cache/bootsnap
      - MALLOC_ARENA_MAX=2                   # cap glibc malloc arenas — curbs Puma memory fragmentation
      # --- Secrets withheld from the Rails container ------------------------
      # `env_file` above loads the whole .env, which holds credentials this
      # container has no use for. Anything set here overrides env_file, so an
      # empty value hides that variable from Rails and from every shell the
      # agent runs inside this container.
      #
      # Why it matters: the agent writes and runs code here. Code running in
      # this container can read its own environment (ENV["ANTHROPIC_API_KEY"],
      # `printenv`), so a key present here is a key the customer can read.
      #
      # This list comes from the 2026-08-09 fleet audit of 97 running boxes, not
      # from reading one codebase. Adding a name here without that evidence will
      # break a customer app at runtime, not at boot: every read found was
      # nil-tolerant ENV["..."], so the app starts fine and then fails its API
      # calls. See docs/handoff_mothership_env_leakage_audit.md in LlamaBot.
      #
      # DELIBERATELY NOT BLANKED, because customer apps call these providers
      # server-side and would lose a working feature:
      #   OPENAI_API_KEY   13 boxes use profile_pic/bio_audio, plus custom
      #                    features on ~8 more (PDF parsing, transcription,
      #                    meeting summaries, book generation).
      #   DEEPSEEK_API_KEY leasure-group-lxd (4 services), lohman, lohman-dev,
      #                    social-support-society and its -dev twin.
      #   GEMINI_API_KEY   leasure-group-lxd.
      # Blank those three only after the LlamaBot proxy endpoint ships and the
      # affected boxes migrate.
      #
      # Also kept because Rails needs them: DATABASE_URL, DB_URI,
      # POSTGRES_PASSWORD, REDIS_URL, SECRET_KEY_BASE, RAILS_MASTER_KEY,
      # LLAMABOT_* and LLAMAPRESS_API_URL.
      #
      # Readers of the names below live in LlamaBot only, which keeps the whole
      # .env, so blanking the Rails copy changes no behaviour.
      - LLAMAPRESS_AI_LOGIN_SECRET=
      - SCHEDULER_TOKEN=
      - WS_SECRET_KEY=
      - AUTH_DB_URI=
      - TAVILY_API_KEY=
      - GROUND_ROUTE_SEARCH_API_KEY=
      # No Rails reader anywhere in the fleet.
      - VSCODE_PASSWORD=
      - GOOGLE_API_KEY=
      - GMI_DEEPSEEK_API_KEY=
      - FIREWORKS_DEEPSEEK_API_KEY=
      - ALIBABA_API_KEY=
      - META_API_KEY=
      - MODEL_API_KEY=
      - BEDROCK_API_KEY=
      # Unfunded fleet-wide and already failing with HTTP 400, so the one box
      # that reads it (leo-salzi) loses nothing.
      - ANTHROPIC_API_KEY=
      # Absent from every probed box's .env (0/97), so blanking costs nothing.
      - AWS_KEY=
      - AWS_PASS=
    volumes:
      - rails_storage:/rails/storage         # ActiveStorage local files
      - ./rails/app:/rails/app:delegated
      - ./rails/config/routes.rb:/rails/config/routes.rb:delegated
      - ./rails/db:/rails/db:delegated
      - ./rails/spec:/rails/spec:delegated
      - ./rails/config/environments/development.rb:/rails/config/environments/development.rb
      - ./rails/config/database.yml:/rails/config/database.yml
      - ./rails/config/importmap.rb:/rails/config/importmap.rb:delegated
      - ./rails/config/initializers/devise.rb:/rails/config/initializers/devise.rb:delegated
      - ./rails/config/initializers/llama_bot_rails.rb:/rails/config/initializers/llama_bot_rails.rb:delegated
      - ./rails/config/initializers/session_cookie.rb:/rails/config/initializers/session_cookie.rb:delegated
      - ./rails/config/initializers/custom:/rails/config/initializers/custom:delegated  # generic extension point: Rails auto-loads initializer subdirs, per-app initializers drop in with no compose change
      - ./rails/config/locales:/rails/config/locales:delegated
      - ./rails/config/storage.yml:/rails/config/storage.yml
      - ./rails/config/environments/test.rb:/rails/config/environments/test.rb
      - ./rails/lib:/rails/lib:delegated
      - ./rails/public/uploads:/rails/public/uploads:delegated
      - ./.leonardo/instance.json:/rails/.leonardo/instance.json:ro  # instance metadata only, NOT the whole .leonardo dir (read by the image's leonardo_instance.rb initializer)
      - ./rails/requirements:/rails/requirements:delegated
    # Fail-open command: if db:prepare or `rails s` exits non-zero, the container stays alive
    # via `tail -f /dev/null` so Leonardo can still `docker exec` in and call `tail_rails_logs`
    # to diagnose the failure. Without this, a bad migration crashes the container and Leonardo
    # gets 409 Conflict on every exec call.
    command: bash -c "rm -f tmp/pids/server.pid; bundle exec rails db:prepare || echo '!! db:prepare failed — keeping container alive for debugging'; bundle exec rails s -b 0.0.0.0; echo '!! Rails server exited — keeping container alive. Use tail_rails_logs to investigate, then restart the container to retry.'; exec tail -f /dev/null"
    #TO DEBUG, comment the above command, uncomment the below command, restart the container, then run the docker compose exec command below.
    # command: tail -f /dev/null
    # docker compose exec -it llamapress bundle exec rails s -b 0.0.0.0
    ports:
      - "3000:3000"                            # http://server_ip/
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llama-network

  llamabot:
    image: kody06/llamabot:0.7.2.1
    restart: unless-stopped
    logging: *default-logging
    # user: "1000:1000"  # Run as UID 1000 to prevent root-owned file creation
    env_file:
      - .env
    command: bash -c "git config --global --add safe.directory /app/leonardo && python init_pg_checkpointer.py && uvicorn main:app --host 0.0.0.0 --port 8000 --ws-max-size 157286400 --ws-ping-interval 60 --ws-ping-timeout 60"
    pid: host  # Required for nsenter to execute commands on host
    privileged: true  # Required for nsenter capabilities
    volumes:
      - ./rails:/app/app/rails
      # NOTE: langgraph.json (the platform base) is deliberately NOT mounted — it ships
      # with the LlamaBot image so new platform agent modes work here with no Leonardo
      # change. Client graphs go in the langgraph.local.json overlay below.
      - ./langgraph/langgraph.local.json:/app/app/langgraph.local.json  # Client overlay: agent registry
      - ./langgraph/agent_modes.json:/app/app/agent_modes.json  # Custom chat-mode dropdown entries
      - ./langgraph/agents:/app/app/user_agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/leonardo  # Full Leonardo repo for git access
      - ./.leonardo:/app/app/.leonardo  # Project context (LEONARDO.md, instance.json)
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llama-network

  db:
    image: postgres:16
    environment:
      POSTGRES_DB:      llamapress_production
      POSTGRES_USER:    postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - llama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llamapress_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - llama-network

  code:
    image: kody06/llamabot-vscode:0.2.0
    container_name: code
    # The VS Code editor is opt-in. This profile keeps `docker compose up -d`
    # (a reboot, bin/update) from starting the editor. LlamaBot starts and stops
    # it on request with `docker compose --profile code up -d code` when someone
    # turns the editor on in Settings. See LlamaBot app/services/vscode_service.py.
    profiles: ["code"]
    environment:
      - TZ=America/Denver
      - PASSWORD=${VSCODE_PASSWORD:-password}
      - PUID=1000
      - PGID=1000
      - LXD_HOST_IP=${LXD_HOST_IP:-}
      - LXD_HOST_PORT=${LXD_HOST_PORT:-}
      - LXD_HOST_USER=${LXD_HOST_USER:-}
      - LEONARDO_IP=${LEONARDO_IP:-}
      # - AUTO_SSH_LEONARDO=1
    volumes:
      - code_config:/config
      - ./:/config/workspace
      # - ~/.ssh/vscode_container_key:/config/.ssh/id_ed25519:ro
      # - ~/.ssh/vscode_container_key.pub:/config/.ssh/id_ed25519.pub:ro
    ports:
      - "8443:8443"
    restart: unless-stopped
    logging: *default-logging

volumes:
  redis_data:
  postgres_data:
  rails_storage:
  code_config:

# Declare the external network
networks:
  llama-network:
    name: llama-network