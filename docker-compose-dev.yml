
version: "3.8"
# docker compose -f docker-compose-dev.yml build

# Cap container logs (json-file grows unbounded by default and fills the disk)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  llamapress:
    # image: kody06/llamapress-simple:0.4.0g        # <— pre-built tag
    build: ../LlamaPress-Simple
    # docker compose -f docker-compose-dev.yml up -d --build llamapress #if you need to rebuild.
    # user: "1000:1000"  # DISABLED for macOS - Docker Desktop handles permissions differently
    env_file: .env                           # read secrets from this file
    environment:
      - RAILS_ENV=development
      - BOOTSNAP_CACHE_DIR=/rails/tmp/cache/bootsnap
      - MALLOC_ARENA_MAX=2                   # cap glibc malloc arenas — curbs Puma memory fragmentation
      # Secrets withheld from the Rails container. Keep this list identical to
      # docker-compose.yml, or the dev box stops matching what the fleet runs.
      # Rationale and the kept-on-purpose list live in docker-compose.yml.
      # NOT blanked: OPENAI_API_KEY, DEEPSEEK_API_KEY and GEMINI_API_KEY are
      # called server-side by real customer apps (2026-08-09 fleet audit).
      - LLAMAPRESS_AI_LOGIN_SECRET=
      - SCHEDULER_TOKEN=
      - WS_SECRET_KEY=
      - AUTH_DB_URI=
      - TAVILY_API_KEY=
      - GROUND_ROUTE_SEARCH_API_KEY=
      - VSCODE_PASSWORD=
      - GOOGLE_API_KEY=
      - GMI_DEEPSEEK_API_KEY=
      - FIREWORKS_DEEPSEEK_API_KEY=
      - ALIBABA_API_KEY=
      - META_API_KEY=
      - MODEL_API_KEY=
      - BEDROCK_API_KEY=
      - ANTHROPIC_API_KEY=
      - AWS_KEY=
      - AWS_PASS=
    volumes:
      - ../LlamaPress-Simple/vendor/llama_bot_rails:/rails/vendor/llama_bot_rails  # Dev: hot reload gem changes
      - rails_storage:/rails/storage         # ActiveStorage local files
      - ./rails/app:/rails/app
      - ./rails/config/routes.rb:/rails/config/routes.rb
      - ./rails/db:/rails/db
      - ./rails/spec:/rails/spec:delegated
      - ./rails/config/environments/development.rb:/rails/config/environments/development.rb
      - ./rails/config/database.yml:/rails/config/database.yml
      - ./rails/config/importmap.rb:/rails/config/importmap.rb
      - ./rails/config/initializers/devise.rb:/rails/config/initializers/devise.rb
      - ./rails/config/initializers/llama_bot_rails.rb:/rails/config/initializers/llama_bot_rails.rb
      - ./rails/config/initializers/session_cookie.rb:/rails/config/initializers/session_cookie.rb
      - ./rails/config/initializers/custom:/rails/config/initializers/custom  # generic extension point: Rails auto-loads initializer subdirs
      - ./rails/config/locales:/rails/config/locales
      - ./rails/config/storage.yml:/rails/config/storage.yml
      - ./rails/config/environments/test.rb:/rails/config/environments/test.rb
      - ./rails/lib:/rails/lib
      - ./rails/public/uploads:/rails/public/uploads
      - ./.leonardo/instance.json:/rails/.leonardo/instance.json:ro  # instance metadata only, NOT the whole .leonardo dir (read by the image's leonardo_instance.rb initializer)
      - ./rails/requirements:/rails/requirements:delegated
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0"
    # command: tail -f /dev/null
    # docker compose exec -it llamapress bundle exec rails s -b 0.0.0.0
    ports:
      - "3000:3000"                            # http://server_ip/
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llama-network

  llamabot:
    # image: kody06/llamabot:0.4.0l
    build: ../LlamaBot
    restart: unless-stopped
    logging: *default-logging
    # user: "1000:1000"  # DISABLED for macOS - Docker Desktop handles permissions differently
    env_file:
      - .env
    command: bash -c "git config --global --add safe.directory /app/leonardo && playwright install --with-deps chromium && python init_pg_checkpointer.py && uvicorn main:app --host 0.0.0.0 --port 8000 --ws-max-size 157286400 --ws-ping-interval 60 --ws-ping-timeout 60"
    # command: bash -c "python init_pg_checkpointer.py && tail -f /dev/null"
    # docker compose exec -it llamabot uvicorn main:app --host 0.0.0.0 --port 8000
    # docker compose exec -it llamabot langgraph dev --host 0.0.0.0
    pid: host  # Required for nsenter to execute commands on host
    privileged: true  # Required for nsenter capabilities
    volumes:
      - auth_json:/app/auth.json
      - ../LlamaBot/app:/app/app  # Dev: full mount for hot reload
      - ./rails:/app/app/rails  # Override: Leonardo's Rails code
      # NOTE: langgraph.json (the platform base) is deliberately NOT mounted — it ships
      # with the LlamaBot image so new platform agent modes work here with no Leonardo
      # change. Client graphs go in the langgraph.local.json overlay below.
      - ./langgraph/langgraph.local.json:/app/app/langgraph.local.json  # Client overlay: agent registry
      - ./langgraph/agent_modes.json:/app/app/agent_modes.json  # Custom chat-mode dropdown entries
      - ./langgraph/agents:/app/app/user_agents  # Add: custom agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/leonardo  # Full Leonardo repo for git access
      - ./.leonardo:/app/app/.leonardo  # Project context (LEONARDO.md, instance.json)
      - playwright_cache:/root/.cache/ms-playwright  # Persist Chromium across restarts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llama-network
  
  db:
    image: postgres:16
    environment:
      POSTGRES_DB:      llamapress_development
      POSTGRES_USER:    postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - llama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llamapress_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - llama-network

  code:
    image: kody06/llamabot-vscode:latest
    container_name: code
    # The VS Code editor is opt-in. This profile keeps `docker compose up -d`
    # (a reboot, bin/update) from starting the editor. LlamaBot starts and stops
    # it on request with `docker compose --profile code up -d code` when someone
    # turns the editor on in Settings. See LlamaBot app/services/vscode_service.py.
    profiles: ["code"]
    user: root
    environment:
      # Run code-server as the host's ubuntu user (1000:1000) so it can write
      # to the bind-mounted repo. Without these, lsio defaults to abc (911:911)
      # and every save into /config/workspace is "permission denied".
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      # Read the password from .env. Never hardcode one here.
      #
      # This line used to read `PASSWORD=password`. Port 8443 is published on all
      # interfaces and this box answers on a public hostname, so the editor was
      # reachable from the internet behind the word "password". The editor mounts
      # the whole project at /config/workspace, which puts the raw .env, and every
      # live API key in it, one sign-in away.
      #
      # `:?` makes compose refuse to run when VSCODE_PASSWORD is unset. A loud
      # failure beats a guessable default.
      - PASSWORD=${VSCODE_PASSWORD:?VSCODE_PASSWORD must be set in .env}
      # - AUTO_SSH_LEONARDO=1
    volumes:
      - code_config:/config
      - ./:/config/workspace
      # - ~/.ssh/vscode_container_key:/config/.ssh/id_ed25519:ro
      # - ~/.ssh/vscode_container_key.pub:/config/.ssh/id_ed25519.pub:ro
    ports:
      - "8443:8443"
    restart: unless-stopped
    logging: *default-logging
      
volumes:
  redis_data:
  postgres_data:
  rails_storage:
  auth_json:
  code_config:
  playwright_cache:  # Chromium binaries for browser_inspect tool

# Declare the external network
networks:
  llama-network:
    name: llama-network